<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личное дело — карточка персонажа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --kk-bg:#181410;--kk-bg-2:#1d1813;--kk-stone:#241d15;--kk-surface:#2a2218;--kk-surface-2:#32281b;
  --kk-line:#48391f;--kk-line-soft:#382d1c;--kk-text:#ece2cf;--kk-text-dim:#a8967a;--kk-text-faint:#7a6a52;
  --kk-gold:#c8a14e;--kk-gold-bright:#e2c178;--kk-gold-dim:#8a6c33;--kk-danger:#bd5a3a;--kk-danger-dim:#6f3522;
  --kk-cell-empty:#2c2317;--kk-cell-line:#4a3a23;--kk-cell-fill:#c8a14e;--kk-tension:#9b59b6;
  --fac:#8e6bd0;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Golos Text',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  /* density */
  --railw:328px; --pad:26px; --rowpad:9px; --gap:22px; --namefs:34px;
}
[data-density="compact"]{ --railw:296px; --pad:18px; --rowpad:6px; --gap:15px; --namefs:28px; }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{min-height:100vh;background:
  radial-gradient(120% 80% at 50% -20%, #221a12 0%, #141009 60%, #0d0a06 100%);
  color:var(--kk-text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:40px 24px 120px;}

.doc{max-width:1180px;margin:0 auto;background:var(--kk-bg);border:1px solid var(--kk-line);
  box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.015);position:relative;}
/* paper tint by faculty on the very edge */
.doc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fac);opacity:.85;}

/* ============ masthead ============ */
.mast{display:flex;align-items:stretch;justify-content:flex-start;border-bottom:1px solid var(--kk-line);
  background:linear-gradient(180deg,var(--kk-stone),var(--kk-bg));}
.mast-r{margin-left:auto;}
.mast-l{display:flex;align-items:center;gap:14px;padding:16px var(--pad);}
.crest{width:38px;height:38px;flex:none;border:1px solid var(--kk-gold-dim);display:grid;place-items:center;
  font:600 20px/1 var(--serif);color:var(--kk-gold);background:var(--kk-bg-2);position:relative;}
.crest::after{content:"";position:absolute;inset:3px;border:1px solid var(--kk-line-soft);}
.mast-title{display:flex;flex-direction:column;gap:3px;}
.mast-title .k{font:600 11px/1 var(--mono);letter-spacing:.24em;color:var(--kk-text-faint);text-transform:uppercase;}
.mast-title .n{font:600 16px/1 var(--serif);letter-spacing:.02em;color:var(--kk-text);}
.mast-r{display:flex;align-items:stretch;}
.mast-meta{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:12px 18px;text-align:right;}
.mast-meta .l{font:500 9.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--kk-text-faint);}
.mast-meta .v{font:500 13px/1 var(--mono);color:var(--kk-text-dim);}
.stamp{display:flex;align-items:center;padding:12px 20px;margin-left:6px;}
.stamp span{font:600 13px/1 var(--serif);font-style:italic;color:var(--fac);border:1.5px solid var(--fac);
  padding:6px 12px;transform:rotate(-3deg);opacity:.92;border-radius:2px;background:color-mix(in srgb,var(--fac) 8%,transparent);}
.mast-actions{display:flex;align-items:center;gap:8px;padding:12px 16px;}
.mbtn{border:1px solid var(--kk-line);background:var(--kk-bg-2);color:var(--kk-text-dim);padding:7px 11px;cursor:pointer;font:600 11px/1 var(--sans);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.mbtn:hover{color:var(--kk-text);border-color:var(--kk-gold-dim);}
.mbtn.on{color:var(--fac);border-color:color-mix(in srgb,var(--fac) 45%,transparent);background:color-mix(in srgb,var(--fac) 8%,transparent);}

/* ============ body grid ============ */
.body{display:grid;grid-template-columns:var(--railw) 1fr;}
.rail{border-right:1px solid var(--kk-line);background:linear-gradient(180deg,rgba(255,255,255,.012),transparent);}
.rail-in{position:sticky;top:20px;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap);}
.main{min-width:0;}

/* ---- ID photo ---- */
.idphoto{position:relative;width:100%;aspect-ratio:4/5;background:
  linear-gradient(160deg, color-mix(in srgb,var(--fac) 30%,var(--kk-stone)), var(--kk-bg-2));
  border:1px solid var(--kk-line);display:grid;place-items:center;overflow:hidden;}
.idphoto .glyph{font:600 84px/1 var(--serif);color:color-mix(in srgb,var(--fac) 55%,var(--kk-gold-bright));opacity:.9;}
.idphoto .ph-note{position:absolute;bottom:8px;left:0;right:0;text-align:center;font:500 9px/1 var(--mono);letter-spacing:.16em;color:var(--kk-text-faint);text-transform:uppercase;}
.tick{position:absolute;width:12px;height:12px;border:1px solid var(--kk-gold-dim);}
.tick.tl{top:6px;left:6px;border-right:0;border-bottom:0;}
.tick.tr{top:6px;right:6px;border-left:0;border-bottom:0;}
.tick.bl{bottom:6px;left:6px;border-right:0;border-top:0;}
.tick.br{bottom:6px;right:6px;border-left:0;border-top:0;}

/* identity block */
.ident{display:flex;flex-direction:column;gap:8px;}
.cc-name{margin:0;font:600 var(--namefs)/1.02 var(--serif);letter-spacing:-.01em;}
.fac-line{display:flex;align-items:center;gap:8px;font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fac);}
.fac-line::before{content:"";width:10px;height:10px;background:var(--fac);flex:none;
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.ident-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;}
.ident-meta dt{color:var(--kk-text-faint);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;align-self:center;}
.ident-meta dd{margin:0;color:var(--kk-text);}
.ident-meta dd.xp{display:flex;align-items:center;gap:8px;}
.lvlup{border:1px solid color-mix(in srgb,var(--fac) 45%,transparent);background:color-mix(in srgb,var(--fac) 10%,transparent);color:var(--fac);padding:3px 8px;border-radius:3px;cursor:pointer;font:600 10px/1.2 var(--sans);}
.lvlup:hover{background:color-mix(in srgb,var(--fac) 20%,transparent);}

/* ---- vitals panel ---- */
.vitals{border:1px solid var(--kk-line);}
.vitals-h{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--kk-line-soft);
  background:var(--kk-stone);}
.vitals-h .t{font:600 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--kk-text-dim);}
.vrow{padding:11px 12px;border-bottom:1px solid var(--kk-line-soft);}
.vrow:last-child{border-bottom:0;}
.vrow .vl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.vrow .vname{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--kk-text-faint);}
.vrow .vval{font:500 13px/1 var(--mono);color:var(--kk-text);}
.vrow .vval b{font-weight:600;color:var(--acc,var(--kk-gold-bright));font-size:15px;}
/* meter */
.meter{height:9px;background:var(--kk-cell-empty);border:1px solid var(--kk-cell-line);position:relative;overflow:hidden;}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--acc,var(--fac));display:block;}
.meter.stripes i{background:repeating-linear-gradient(45deg,var(--acc,var(--kk-gold)) 0 6px, color-mix(in srgb,var(--acc,var(--kk-gold)) 60%,#000) 6px 12px);}
/* marks (bennies) */
.marks{display:flex;gap:5px;flex-wrap:wrap;}
.mark{width:14px;height:14px;border:1px solid var(--kk-cell-line);transform:rotate(45deg);}
.mark.on{background:var(--fac);border-color:transparent;}
/* health pips (compact) */
.hp{display:flex;gap:6px;}
.hp .pip{flex:1;height:30px;position:relative;display:flex;background:var(--kk-cell-empty);border:1px solid var(--kk-cell-line);cursor:pointer;overflow:hidden;}
.hp .pip .seg{flex:1;transition:background .12s;}
.hp .pip .seg+.seg{border-left:1px solid var(--kk-cell-line);}
.hp .pip .seg.filled{background:var(--fac);}
.hp .pip.ko .seg.filled{background:var(--kk-danger);}
.hp .pip .num{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:600 12px/1 var(--mono);color:var(--kk-text);text-shadow:0 1px 2px rgba(0,0,0,.45);}
.hp-2{display:flex;flex-direction:column;gap:9px;}
.hp-lab{display:flex;justify-content:space-between;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--kk-text-faint);margin-bottom:5px;}

/* ============ main / tabs ============ */
.tabs{display:flex;border-bottom:1px solid var(--kk-line);background:var(--kk-bg-2);position:sticky;top:0;z-index:5;}
.tab{flex:1;position:relative;padding:15px 20px;border:0;background:transparent;color:var(--kk-text-faint);cursor:pointer;
  font:600 12px/1 var(--sans);letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:8px;}
.tab .tn{font:500 10px/1 var(--mono);opacity:.6;}
.tab:hover{color:var(--kk-text-dim);}
.tab.on{color:var(--kk-text);}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--fac);}
.tab+.tab{border-left:1px solid var(--kk-line-soft);}
.tabpanel{padding:var(--pad);display:none;flex-direction:column;gap:calc(var(--gap) + 8px);}
.tabpanel.on{display:flex;}

/* section ledger header */
.sec{display:flex;flex-direction:column;}
.sec>.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.sec>.sh .idx{font:600 11px/1 var(--mono);color:var(--fac);letter-spacing:.05em;}
.sec>.sh .tt{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--kk-text-dim);}
.sec>.sh .rule{flex:1;height:1px;background:var(--kk-line-soft);}
.sec>.sh .ct{font:500 11px/1 var(--mono);color:var(--kk-text-faint);}

/* attributes strip (flat, ruled) */
.attrs{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--kk-line);}
.attr{padding:14px 8px 12px;text-align:center;border-right:1px solid var(--kk-line-soft);position:relative;}
.attr:last-child{border-right:0;}
.attr .an{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--kk-text-faint);margin-bottom:9px;}
.attr .ad{font:600 30px/1 var(--serif);color:var(--kk-text);}
.attr .amod{font:500 12px/1 var(--mono);color:var(--fac);margin-left:1px;}
.attr .roll{margin:10px auto 0;width:26px;height:22px;border:1px solid var(--kk-line);background:var(--kk-bg-2);color:var(--kk-text-faint);display:grid;place-items:center;cursor:pointer;transition:.15s;}
.attr .roll:hover{color:var(--kk-gold-bright);border-color:var(--kk-gold-dim);}
.attr .roll svg{width:14px;height:14px;}

/* statuses as ruled tags (not floaty pills) */
.stat-list{display:flex;flex-wrap:wrap;gap:0;min-height:38px;align-items:center;justify-content:space-around;border:1px solid var(--kk-line);}
.stat-tag{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-right:1px solid var(--kk-line-soft);font-size:12.5px;}
.stat-tag .dur{font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--kk-text-faint);}
.stat-tag .x{color:var(--kk-text-faint);cursor:pointer;font-size:13px;}
.stat-add{padding:2px 8px;border:1px solid color-mix(in srgb,var(--fac) 45%,transparent);border-radius:3px;background:transparent;color:var(--fac);cursor:pointer;font:600 11px/1.4 var(--sans);}
.stat-add:hover{background:color-mix(in srgb,var(--fac) 12%,transparent);}

/* skills ledger */
.skcols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;}
.skgroup{margin-bottom:16px;break-inside:avoid;}
.skcat{display:flex;align-items:center;gap:8px;font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--kk-text-faint);margin-bottom:6px;}
.skcat .l{flex:1;height:1px;background:var(--kk-line-soft);}
.skgroup.fac .skcat{color:var(--fac);opacity:1;}
.skgroup.fac .skcat .l{background:color-mix(in srgb,var(--fac) 35%,transparent);}
.skgroup.fac .sk .kd{color:var(--fac);}
.sk{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:10px;padding:var(--rowpad) 2px;border-bottom:1px solid var(--kk-line-soft);}
.sk:hover{background:rgba(255,255,255,.02);}
.sk .kn{font-size:13.5px;}
.sk.untr .kn{color:var(--kk-text-faint);font-style:italic;}
.sk .ka{font:500 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--kk-text-faint);}
.sk .kd{font:600 13px/1 var(--mono);color:var(--kk-text);min-width:40px;text-align:right;}
.sk .roll{width:24px;height:20px;border:1px solid var(--kk-line-soft);background:transparent;color:var(--kk-text-faint);display:grid;place-items:center;cursor:pointer;}
.sk .roll:hover{color:var(--kk-gold-bright);border-color:var(--kk-gold-dim);}
.sk .roll svg{width:13px;height:13px;}

/* features / items ledger rows */
.entries{border:1px solid var(--kk-line);}
.entry{padding:13px 15px;border-bottom:1px solid var(--kk-line-soft);}
.entry:last-child{border-bottom:0;}
.entry .eh{display:flex;align-items:baseline;gap:10px;margin-bottom:5px;}
.entry .en{font:600 14px/1.2 var(--serif);}
.entry .badge{font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--kk-text-faint);border:1px solid var(--kk-line-soft);padding:3px 7px;}
.entry .badge.acc{color:var(--fac);border-color:color-mix(in srgb,var(--fac) 45%,transparent);}
.entry .badge.eq{color:var(--kk-gold);border-color:var(--kk-gold-dim);}
.entry .code{margin-left:auto;font:500 10px/1 var(--mono);color:var(--kk-text-faint);}
.entry .ed{font-size:12.5px;color:var(--kk-text-dim);line-height:1.5;}
.entry .er{font-size:11.5px;color:var(--kk-text-faint);font-style:italic;margin-top:4px;}

/* dossier form */
.form{border:1px solid var(--kk-line);}
.frow{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--kk-line-soft);}
.frow:last-child{border-bottom:0;}
.frow dt{padding:10px 14px;font:500 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--kk-text-faint);
  background:rgba(255,255,255,.015);border-right:1px solid var(--kk-line-soft);align-self:stretch;display:flex;align-items:center;}
.frow dd{margin:0;padding:10px 14px;font-size:13px;}
.bio{padding:15px;border:1px solid var(--kk-line);border-top:0;font-size:13px;color:var(--kk-text-dim);line-height:1.6;font-style:italic;}
.taglist{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--kk-line);}
.taglist span{padding:8px 13px;border-right:1px solid var(--kk-line-soft);font-size:12.5px;}
.taglist span .rk{font:500 10px/1 var(--mono);color:var(--kk-text-faint);text-transform:uppercase;letter-spacing:.06em;margin-left:6px;}

.cc-hide{display:none !important;}

/* rail combat quick-stats */
.railstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rsbtn{border:1px solid var(--kk-line);padding:9px 11px;display:flex;flex-direction:column;gap:6px;background:var(--kk-bg-2);}
.rsbtn .rl{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--kk-text-faint);}
.rsbtn .rv{font:600 22px/1 var(--serif);color:var(--kk-text);}
.rsbtn .rv.sm{font:600 12px/1.35 var(--mono);color:var(--kk-text-dim);}

/* rail statuses */
.rail-status{border:1px solid var(--kk-line);}
.rs-head{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;border-bottom:1px solid var(--kk-line-soft);background:var(--kk-stone);}
.rs-head .t{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--kk-text-dim);}
.rs-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 11px;}
.rs-chips:empty::before{content:"нет активных";font:italic 11.5px/1 var(--sans);color:var(--kk-text-faint);}
.rchip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--kk-line-soft);font-size:12px;background:var(--kk-bg-2);}
.rchip.scene{border-style:dashed;color:var(--kk-text-dim);}
.rchip .dur{font:500 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--kk-text-faint);}
.rchip .x{color:var(--kk-text-faint);cursor:pointer;font-size:13px;}

/* equipment by type */
.itemgroup+.itemgroup{margin-top:16px;}
.itemgroup .skcat{color:var(--kk-text-faint);}
.entry.item .eh{align-items:center;}
.entry.item.active{border-left:2px solid var(--fac);background:color-mix(in srgb,var(--fac) 5%,transparent);}
.dotf{width:7px;height:7px;border-radius:50%;background:var(--fac);flex:none;}
.istate{margin-left:auto;font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--kk-text-faint);}
.entry.item.active .istate{color:var(--fac);}
.istates{margin-left:auto;display:flex;gap:6px;}
.ist{font:600 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--kk-text-faint);border:1px solid var(--kk-line-soft);padding:4px 7px;}
.ist.on{color:var(--fac);border-color:color-mix(in srgb,var(--fac) 45%,transparent);background:color-mix(in srgb,var(--fac) 8%,transparent);}
.rollbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--kk-line);background:var(--kk-bg-2);color:var(--kk-text-dim);padding:3px 8px;cursor:pointer;font:600 11px/1 var(--mono);}
.rollbtn:hover{color:var(--kk-gold-bright);border-color:var(--kk-gold-dim);}
.rollbtn svg{width:12px;height:12px;}
.rollbtn .rd{color:var(--kk-text);}

/* section edit button */
.editbtn{border:1px solid var(--kk-line-soft);background:transparent;color:var(--kk-text-faint);padding:4px 10px;border-radius:3px;cursor:pointer;font:600 10.5px/1.2 var(--sans);}
.editbtn:hover{color:var(--kk-text);border-color:var(--kk-gold-dim);}

/* relations (expandable) */
.rels{border:1px solid var(--kk-line);}
.rel+.rel{border-top:1px solid var(--kk-line-soft);}
.rel-head{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;}
.rel-head:hover{background:rgba(255,255,255,.02);}
.rel-head .rn{font:600 14px/1 var(--serif);}
.rel-head .rk{font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--kk-text-faint);border:1px solid var(--kk-line-soft);padding:3px 6px;}
.rel-head .rlvl{margin-left:auto;font:500 11px/1 var(--mono);color:var(--kk-text-dim);}
.rel-head .rlvl b{color:var(--fac);font-weight:600;}
.rel-head .chev{color:var(--kk-text-faint);transition:transform .15s;font-size:11px;}
.rel.open .rel-head .chev{transform:rotate(90deg);}
.rel-body{display:none;gap:14px;padding:2px 13px 14px;}
.rel.open .rel-body{display:flex;}
.relav{width:54px;height:54px;flex:none;display:grid;place-items:center;font:600 24px/1 var(--serif);color:color-mix(in srgb,var(--fac) 70%,var(--kk-gold-bright));background:linear-gradient(155deg,color-mix(in srgb,var(--fac) 28%,var(--kk-stone)),var(--kk-bg-2));border:1px solid var(--kk-line);}
.relmain{display:flex;flex-direction:column;gap:9px;min-width:0;flex:1;}
.relscale{display:flex;align-items:center;gap:8px;}
.lvlbtn{width:24px;height:22px;border:1px solid var(--kk-line);background:var(--kk-bg-2);color:var(--kk-text-dim);cursor:pointer;font-size:14px;line-height:1;}
.lvlbtn:hover{border-color:var(--kk-gold-dim);color:var(--kk-text);}
.relbar{position:relative;flex:1;height:12px;background:var(--kk-cell-empty);border:1px solid var(--kk-cell-line);overflow:hidden;}
.relbar-zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--kk-text-faint);opacity:.55;}
.relbar-fill{position:absolute;top:0;bottom:0;transition:left .12s,width .12s;}
.relbar-fill.pos{background:var(--fac);}
.relbar-fill.neg{background:var(--kk-danger);}
.reltags{display:flex;flex-wrap:wrap;gap:6px;}
.rtag{font-size:11px;padding:3px 8px;border:1px solid var(--kk-line-soft);color:var(--kk-text-dim);}
.relnote{font-size:12px;color:var(--kk-text-dim);font-style:italic;line-height:1.5;}

/* magic talents */
.talents{border:1px solid var(--kk-line);}
.tal{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid var(--kk-line-soft);}
.tal:last-child{border-bottom:0;}
.tal .tn{font-size:13.5px;}
.tal.max .tn{color:var(--fac);font-weight:600;}
.tal.neg .tn{color:var(--kk-text-faint);}
.tscale{display:flex;gap:3px;}
.tcell{width:22px;height:11px;border:1px solid var(--kk-cell-line);background:var(--kk-cell-empty);}
.tcell.negslot{width:14px;opacity:.7;}
.tcell.on{background:var(--kk-cell-fill);border-color:transparent;}
.tal.max .tcell.on{background:var(--fac);border-color:transparent;box-shadow:0 0 7px color-mix(in srgb,var(--fac) 60%,transparent);}
.tcell.negslot.on{background:var(--kk-danger);border-color:transparent;}
.tval{font:600 13px/1 var(--mono);min-width:26px;text-align:right;color:var(--kk-text-dim);}
.tal.max .tval{color:var(--fac);}
.tal.neg .tval{color:var(--kk-danger);}

/* ============ control bar ============ */
#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:14px;
  padding:9px 14px;border-radius:12px;background:rgba(24,20,15,.95);backdrop-filter:blur(8px);border:1px solid var(--kk-line);
  box-shadow:0 14px 40px rgba(0,0,0,.5);font-family:var(--sans);}
#bar .grp{display:flex;align-items:center;gap:8px;}
#bar .cap{font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--kk-text-faint);}
#bar .div{width:1px;height:26px;background:var(--kk-line);}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.25);padding:0;cursor:pointer;transition:transform .12s;}
.dot:hover{transform:scale(1.18);}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px rgba(24,20,15,.95),0 0 0 4px #e2c178;}
.seg{display:flex;border:1px solid var(--kk-line);border-radius:7px;overflow:hidden;}
.seg button{border:0;background:transparent;color:var(--kk-text-faint);padding:7px 11px;font:600 11px/1 var(--sans);cursor:pointer;}
.seg button.on{background:var(--kk-gold);color:#1a140c;}
#blocksBtn{border:1px solid var(--kk-line);background:transparent;color:var(--kk-text-dim);border-radius:7px;padding:7px 11px;font:600 11px/1 var(--sans);cursor:pointer;}
#blocksBtn:hover{color:var(--kk-text);border-color:var(--kk-gold-dim);}
#blocksPop{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:210;display:none;flex-wrap:wrap;gap:6px 14px;max-width:520px;
  padding:14px 16px;border-radius:12px;background:rgba(24,20,15,.97);border:1px solid var(--kk-line);box-shadow:0 14px 40px rgba(0,0,0,.5);}
#blocksPop.on{display:flex;}
#blocksPop label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--kk-text-dim);cursor:pointer;width:calc(33% - 10px);}
#blocksPop input{accent-color:var(--kk-gold);}

@media(max-width:820px){
  .body{grid-template-columns:1fr;}
  .rail{border-right:0;border-bottom:1px solid var(--kk-line);}
  .rail-in{position:static;}
}
</style>
</head>
<body>
<div class="doc" id="doc"></div>

<div id="bar">
  <div class="grp"><span class="cap">Тема</span><span id="dots"></span></div>
  <div class="div"></div>
  <div class="grp"><span class="cap">Плотн.</span>
    <div class="seg" id="density"><button data-d="spacious" class="on">Просторно</button><button data-d="compact">Компактно</button></div>
  </div>
  <div class="div"></div>
  <button id="blocksBtn">Блоки ▾</button>
</div>
<div id="blocksPop"></div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var ch=window.KK_CHAR;
  var ATTR_ORDER=["agility","smarts","spirit","endurance","magic"];
  var ATTR_LABEL={agility:"Ловкость",smarts:"Смекалка",spirit:"Дух",endurance:"Вынослив.",magic:"Магия"};
  var ATTR_SHORT={agility:"ЛОВ",smarts:"СМЕ",spirit:"ДУХ",endurance:"ВЫН",magic:"МАГ"};
  var CAT_ORDER=["common","learned","personal","magic"];
  var CAT_LABEL={common:"Общие",learned:"Изученные",personal:"Личные",magic:"Магические",other:"Прочие"};
  var dieStr=function(d,m){return "d"+d+(m?(m>0?"+"+m:""+m):"");};
  var DICE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.1" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.1" fill="currentColor" stroke="none"/></svg>';
  var esc=function(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});};

  function attrPipSizes(die){return {20:[2,2,2,2,1],12:[1,2,2,2,1],10:[1,1,2,2,1],8:[1,1,1,2,1]}[die]||[1,1,1,1,1];}
  function computeHealthPips(die){var sizes=attrPipSizes(die).map(function(s,i){return i===4?1:s;});var th=[0];for(var i=0;i<4;i++)th.push(th[i]+sizes[i]);return{sizes:sizes,thresholds:th,max:sizes.reduce(function(a,b){return a+b;},0)};}
  function pipsHtml(die,value){
    var c=computeHealthPips(die);
    return c.sizes.map(function(size,i){
      var lo=c.thresholds[i],filled=Math.max(0,Math.min(size,value-lo)),ko=i===4,segs="";
      for(var k=0;k<size;k++)segs+='<span class="seg'+(k<filled?" filled":"")+'"></span>';
      return '<div class="pip'+(ko?" ko":"")+'">'+segs+'<span class="num">'+(i+1)+'</span></div>';
    }).join("");
  }

  // ---------- masthead ----------
  function masthead(){
    var year=ch.academyYear==="graduate"?"ВЫПУСК":ch.academyYear+" КУРС";
    return '<div class="mast"><div class="mast-l">'+
      '<div class="mast-title"><span class="k">Академия · Личное дело</span><span class="n">Реестр учащихся</span></div></div>'+
      '<div class="stamp"><span>СЕКРЕТНО</span></div>'+
      '<div class="mast-r">'+
        '<div class="mast-actions">'+
          '<button class="mbtn" id="logBtn">▤ Лог</button>'+
          '<button class="mbtn" id="rollsBtn">⚄ Броски: вкл</button>'+
          '<button class="mbtn" id="gmBtn">✒ Мастерская</button>'+
        '</div>'+
        '<div class="mast-meta"><span class="l">Дело №</span><span class="v">KK-'+String(ch.age)+'·'+ch.academyYear+ch.semester+'-042</span></div>'+
        '<div class="mast-meta"><span class="l">Курс</span><span class="v">'+year+'</span></div>'+
      '</div></div>';
  }

  // ---------- rail ----------
  function idPhoto(){
    return '<div class="idphoto"><span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>'+
      '<span class="glyph">'+esc((ch.name||"?").slice(0,1))+'</span><span class="ph-note">фото учащегося</span></div>';
  }
  function ident(){
    var fac=ch.faculty||{};
    return '<div class="ident"><h1 class="cc-name">'+esc(ch.name)+'</h1>'+
      (fac.name?'<div class="fac-line">'+esc(fac.name)+'</div>':'')+
      '<dl class="ident-meta">'+
        '<dt>Возраст</dt><dd>'+esc(ch.age)+' лет</dd>'+
        '<dt>Семестр</dt><dd>'+esc(ch.semester)+'</dd>'+
        '<dt>Монеты</dt><dd>'+esc(ch.money)+'</dd>'+
        '<dt>Опыт</dt><dd class="xp">'+esc(ch.experience)+'<button class="lvlup" id="lvlupBtn">↑ Прокачка</button></dd>'+
      '</dl></div>';
  }
  function vitals(){
    var t=ch.tension||{},en=ch.energy||{},b=ch.bennies||0,BMAX=9;
    var enPct=Math.round((en.value/en.max)*100),tPct=Math.round((t.current/t.max)*100);
    var marks="";for(var i=0;i<BMAX;i++)marks+='<span class="mark'+(i<b?" on":"")+'"></span>';
    return '<div class="vitals">'+
      // health
      '<div class="vrow"><div class="hp-2">'+
        '<div><div class="hp-lab"><span>Физическое</span><span>'+ch.health.physical.value+'/'+computeHealthPips(ch.attributes.endurance.die).max+'</span></div><div class="hp">'+pipsHtml(ch.attributes.endurance.die,ch.health.physical.value)+'</div></div>'+
        '<div><div class="hp-lab"><span>Ментальное</span><span>'+ch.health.mental.value+'/'+computeHealthPips(ch.attributes.spirit.die).max+'</span></div><div class="hp">'+pipsHtml(ch.attributes.spirit.die,ch.health.mental.value)+'</div></div>'+
      '</div></div>'+
      // energy
      '<div class="vrow" style="--acc:var(--fac)"><div class="vl"><span class="vname">Энергия</span><span class="vval"><b>'+en.value+'</b> / '+en.max+'</span></div><div class="meter"><i style="width:'+enPct+'%"></i></div></div>'+
      // tension
      '<div class="vrow" style="--acc:var(--kk-tension)"><div class="vl"><span class="vname">Напряжение</span><span class="vval"><b>'+t.current+'</b> / '+t.max+'</span></div><div class="meter stripes"><i style="width:'+tPct+'%"></i></div></div>'+
      // bennies
      '<div class="vrow" style="--acc:var(--fac)"><div class="vl"><span class="vname">Жетоны судьбы</span><span class="vval"><b>'+b+'</b> / '+BMAX+'</span></div><div class="marks">'+marks+'</div></div>'+
    '</div>';
  }

  // ---------- sections ----------
  function lvlPips(lvl){var s="";for(var i=1;i<=5;i++)s+='<span class="lp'+(i<=lvl?" on":"")+'"></span>';return s;}
  function relBar(v){var half=Math.abs(v)/100*50,left=v>=0?50:(50-half);return '<span class="relbar-fill '+(v>=0?'pos':'neg')+'" style="left:'+left+'%;width:'+half+'%"></span>';}
  function sh(idx,title,count){return '<div class="sh"><span class="idx">'+idx+'</span><span class="tt">'+title+'</span><span class="rule"></span>'+(count?'<span class="ct">'+count+'</span>':'')+'</div>';}
  function secAttrs(){
    return '<section class="sec" data-sec="attributes">'+sh("01","Атрибуты")+
      '<div class="attrs">'+ATTR_ORDER.map(function(k){var a=ch.attributes[k];
        return '<div class="attr"><div class="an">'+ATTR_SHORT[k]+'</div><div class="ad">d'+a.die+(a.modifier?'<span class="amod">'+(a.modifier>0?"+"+a.modifier:a.modifier)+'</span>':'')+'</div>'+
          '<button class="roll">'+DICE+'</button></div>';}).join("")+'</div></section>';
  }
  function secStatuses(){
    var n=(ch.activeStatuses||[]).length;
    var tags=(ch.activeStatuses||[]).map(function(s){
      return '<span class="stat-tag">'+esc(s.name)+(s.durationMode==="scene"?'<span class="dur">сцена</span>':'')+'<span class="x">×</span></span>';}).join("");
    var head='<div class="sh"><span class="idx">02</span><span class="tt">Состояния</span><span class="rule"></span><span class="ct">'+n+'</span><button class="stat-add">+ добавить</button></div>';
    return '<section class="sec" data-sec="statuses">'+head+
      '<div class="stat-list">'+tags+'</div></section>';
  }
  function secFeatures(){
    return '<section class="sec" data-sec="features">'+sh("03","Черты и возможности",(ch.features||[]).length)+
      '<div class="entries">'+(ch.features||[]).map(function(f){
        return '<div class="entry"><div class="eh"><span class="en">'+esc(f.name)+'</span>'+
          '<span class="badge '+(f.kind==="unique"?"acc":"")+'">'+(f.isWeakness?"Слабость":f.kind==="unique"?"Уникальная":"Черта")+'</span></div>'+
          (f.description?'<div class="ed">'+esc(f.description)+'</div>':'')+
          (f.restrictions?'<div class="er">Ограничение: '+esc(f.restrictions)+'</div>':'')+'</div>';}).join("")+'</div></section>';
  }
  function secSkills(){
    var facSkills=(ch.skills||[]).filter(function(s){return s.categ==="magic";});
    var others=(ch.skills||[]).filter(function(s){return s.categ!=="magic";});
    var facName=(ch.faculty&&ch.faculty.name)?ch.faculty.name:"Факультетские";
    function skRow(s){var unt=s.die===4&&s.modifier<=-2;
      return '<div class="sk'+(unt?" untr":"")+'"><span class="kn">'+esc(s.name)+'</span><span class="ka">'+ATTR_SHORT[s.attr]+'</span>'+
        '<span class="kd">'+dieStr(s.die,s.modifier)+'</span><button class="roll">'+DICE+'</button></div>';}
    var facGroup=facSkills.length?'<div class="skgroup fac"><div class="skcat">'+esc(facName)+'<span class="l"></span></div>'+facSkills.map(skRow).join("")+'</div>':'';
    var otherGroup=others.length?'<div class="skgroup"><div class="skcat">Прочие навыки<span class="l"></span></div>'+others.map(skRow).join("")+'</div>':'';
    return '<section class="sec" data-sec="skills">'+sh("01","Навыки",(ch.skills||[]).length)+'<div class="skcols">'+facGroup+otherGroup+'</div></section>';
  }
  function secItems(){
    var items=ch.items||[];
    var types=[];items.forEach(function(it){var t=it.subtype||it.type||"Прочее";if(types.indexOf(t)<0)types.push(t);});
    var groups=types.map(function(t){
      var rows=items.filter(function(it){return (it.subtype||it.type||"Прочее")===t;}).map(function(it){
        var active=!!it.active, equipped=!!it.equipped;
        return '<div class="entry item'+(active?' active':'')+'"><div class="eh">'+
          (active?'<span class="dotf"></span>':'')+
          '<span class="en">'+esc(it.name)+'</span>'+
          (it.roll?'<button class="rollbtn"><span class="rd">'+esc(it.roll)+'</span>'+DICE+'</button>':'')+
          '<span class="istates"><span class="ist'+(equipped?' on':'')+'">Экип.</span><span class="ist'+(active?' on':'')+'">Актив.</span></span>'+
        '</div>'+(it.desc?'<div class="ed">'+esc(it.desc)+'</div>':'')+'</div>';
      }).join("");
      return '<div class="itemgroup"><div class="skcat">'+esc(t)+'<span class="l"></span></div><div class="entries">'+rows+'</div></div>';
    }).join("");
    return '<section class="sec" data-sec="items">'+sh("01","Снаряжение",items.length)+groups+'</section>';
  }
  function secBio(){
    var fields=[["birthplace","Место рожд."],["dormitory","Общежитие"],["height","Рост"],["build","Телослож."],["allergies","Аллергии"]].filter(function(f){return ch[f[0]];});
    var form='<dl class="form">'+fields.map(function(f){return '<div class="frow"><dt>'+f[1]+'</dt><dd>'+esc(ch[f[0]])+'</dd></div>';}).join("")+'</dl>';
    return '<section class="sec" data-sec="bio">'+
      '<div class="sh"><span class="idx">01</span><span class="tt">Анкета</span><span class="rule"></span><button class="editbtn">✒ править</button></div>'+form+
      (ch.biography?'<div class="bio">«'+esc(ch.biography)+'»</div>':'')+'</section>';
  }
  function secLangs(){
    if(!ch.languages||!ch.languages.length)return '';
    return '<section class="sec" data-sec="languages">'+sh("02","Языки",ch.languages.length)+
      '<div class="taglist">'+ch.languages.map(function(l){return '<span>'+esc(l.name)+'</span>';}).join("")+'</div></section>';
  }
  function secRelations(){
    if(!ch.relations||!ch.relations.length)return '';
    var rows=ch.relations.map(function(r,idx){
      var lvl=r.level==null?0:r.level,sign=(lvl>0?'+'+lvl:lvl);
      return '<div class="rel" data-rel="'+idx+'">'+
        '<div class="rel-head" data-relhead="'+idx+'">'+
          '<span class="rn">'+esc(r.name)+'</span><span class="rk">'+esc(r.kind)+'</span>'+
          '<span class="rlvl">Связь <b data-rellvl="'+idx+'">'+sign+'</b></span><span class="chev">▸</span>'+
        '</div>'+
        '<div class="rel-body"><div class="relav">'+esc((r.name||"?").slice(0,1))+'</div>'+
          '<div class="relmain">'+
            (r.tags&&r.tags.length?'<div class="reltags">'+r.tags.map(function(t){return '<span class="rtag">'+esc(t)+'</span>';}).join("")+'</div>':'')+
            '<div class="relscale"><button class="lvlbtn" data-rel="'+idx+'" data-lvldelta="-10">−</button>'+
              '<div class="relbar" data-relbar="'+idx+'"><span class="relbar-zero"></span>'+relBar(lvl)+'</div>'+
              '<button class="lvlbtn" data-rel="'+idx+'" data-lvldelta="10">+</button></div>'+
            (r.note?'<div class="relnote">'+esc(r.note)+'</div>':'')+
          '</div></div>'+
      '</div>';
    }).join("");
    return '<section class="sec" data-sec="relations">'+sh("03","Связи",ch.relations.length)+'<div class="rels">'+rows+'</div></section>';
  }

  function secTalents(){
    var list=ch.magicTalents||[];
    if(!list.length)return '';
    var rows=list.map(function(t){
      var v=t.value,max=v>=5,neg=v<=-1;
      var cells='<span class="tcell negslot'+(neg?' on':'')+'"></span>';
      for(var i=1;i<=5;i++)cells+='<span class="tcell'+(v>=i?' on':'')+'"></span>';
      return '<div class="tal'+(max?' max':'')+(neg?' neg':'')+'"><span class="tn">'+esc(t.name)+'</span>'+
        '<span class="tscale">'+cells+'</span><span class="tval">'+(v>0?'+'+v:v)+'</span></div>';
    }).join("");
    return '<section class="sec" data-sec="talents">'+sh("04","Магические таланты",list.length)+'<div class="talents">'+rows+'</div></section>';
  }

  function combatStats(){
    var init='d'+ch.attributes.agility.die+' · d'+ch.attributes.smarts.die+' · d6';
    return '<div class="railstats">'+
      '<div class="rsbtn"><span class="rl">Стойкость</span><span class="rv">'+esc(ch.health.physical.toughness)+'</span></div>'+
      '<div class="rsbtn"><span class="rl">Инициатива</span><span class="rv sm">'+init+'</span></div>'+
    '</div>';
  }
  function railStatuses(){
    var tags=(ch.activeStatuses||[]).map(function(s){
      return '<span class="rchip'+(s.durationMode==="scene"?" scene":"")+'">'+esc(s.name)+(s.durationMode==="scene"?'<span class="dur">сцена</span>':'')+'<span class="x">×</span></span>';}).join("");
    return '<div class="rail-status" data-sec="statuses"><div class="rs-head"><span class="t">Состояния</span><button class="stat-add">+ добавить</button></div><div class="rs-chips">'+tags+'</div></div>';
  }

  var TABS=[
    {id:"overview",name:"Обзор",no:"I",body:function(){return secAttrs()+secFeatures()+secTalents();}},
    {id:"skills",name:"Навыки",no:"II",body:function(){return secSkills();}},
    {id:"gear",name:"Снаряжение",no:"III",body:function(){return secItems();}},
    {id:"dossier",name:"Досье",no:"IV",body:function(){return secBio()+secLangs()+secRelations();}},
  ];

  function render(){
    var tabsBar='<div class="tabs">'+TABS.map(function(t,i){return '<button class="tab'+(i===0?" on":"")+'" data-tab="'+t.id+'"><span class="tn">'+t.no+'</span>'+t.name+'</button>';}).join("")+'</div>';
    var panels=TABS.map(function(t,i){return '<div class="tabpanel'+(i===0?" on":"")+'" data-panel="'+t.id+'">'+t.body()+'</div>';}).join("");
    document.getElementById("doc").innerHTML=masthead()+
      '<div class="body"><aside class="rail"><div class="rail-in">'+idPhoto()+ident()+railStatuses()+vitals()+combatStats()+'</div></aside>'+
      '<div class="main">'+tabsBar+panels+'</div></div>';
    document.querySelectorAll(".tab").forEach(function(btn){btn.onclick=function(){
      document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b===btn);});
      document.querySelectorAll(".tabpanel").forEach(function(p){p.classList.toggle("on",p.getAttribute("data-panel")===btn.getAttribute("data-tab"));});
      applyHidden();
    };});
    document.querySelectorAll("[data-relhead]").forEach(function(h){h.onclick=function(){h.parentNode.classList.toggle("open");};});
    document.querySelectorAll(".lvlbtn").forEach(function(b){b.onclick=function(e){e.stopPropagation();
      var idx=+b.getAttribute("data-rel"),d=+b.getAttribute("data-lvldelta"),r=ch.relations[idx];
      var v=Math.max(-100,Math.min(100,(r.level||0)+d));r.level=v;
      var lab=document.querySelector('[data-rellvl="'+idx+'"]');if(lab)lab.textContent=(v>0?'+'+v:v);
      var bar=document.querySelector('[data-relbar="'+idx+'"]');if(bar)bar.innerHTML='<span class="relbar-zero"></span>'+relBar(v);};});
    var rollsBtn=document.getElementById("rollsBtn");
    if(rollsBtn){rollsBtn.classList.add("on");rollsBtn.onclick=function(){var on=rollsBtn.classList.toggle("on");rollsBtn.innerHTML='⚄ Броски: '+(on?'вкл':'выкл');};}
    var gmBtn=document.getElementById("gmBtn");
    if(gmBtn)gmBtn.onclick=function(){gmBtn.classList.toggle("on");pop.classList.toggle("on");};
  }

  // ---------- palettes (unchanged token maps) ----------
  var PALETTES={
    goldleaf:{name:"Золото",dot:"#c8a14e",vars:{}},

    rosewood:{name:"Розовое дерево",dot:"#c0392b",vars:{"--kk-bg":"#f6e7e5","--kk-bg-2":"#f0dcd9","--kk-stone":"#f8edec","--kk-surface":"#fbf2f1","--kk-surface-2":"#f3e4e3","--kk-line":"#e1c2be","--kk-line-soft":"#ecd5d2","--kk-text":"#2e1a18","--kk-text-dim":"#6b4d49","--kk-text-faint":"#9c7c78","--kk-gold":"#c0392b","--kk-gold-bright":"#9a2c20","--kk-gold-dim":"#9a2c20","--kk-danger":"#b5882f","--kk-danger-dim":"#efe2c8","--kk-cell-empty":"#f0ddda","--kk-cell-line":"#dcbab5","--kk-cell-fill":"#c0392b","--kk-tension":"#9b59b6"}},

  var BASE={};["--kk-bg","--kk-bg-2","--kk-stone","--kk-surface","--kk-surface-2","--kk-line","--kk-line-soft","--kk-text","--kk-text-dim","--kk-text-faint","--kk-gold","--kk-gold-bright","--kk-gold-dim","--kk-danger","--kk-danger-dim","--kk-cell-empty","--kk-cell-line","--kk-cell-fill","--kk-tension"].forEach(function(k){BASE[k]=getComputedStyle(document.documentElement).getPropertyValue(k);});
  var LS={pal:"kk-cc-pal",den:"kk-cc-den",hidden:"kk-cc-hidden"};
  function rl(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
  function wl(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  var state={pal:rl(LS.pal,"goldleaf"),den:rl(LS.den,"spacious"),hidden:rl(LS.hidden,"").split(",").filter(Boolean)};
  if(!PALETTES[state.pal])state.pal="goldleaf";

  function applyPalette(){var v=PALETTES[state.pal].vars,root=document.documentElement;for(var k in BASE)root.style.setProperty(k,(v[k]!=null?v[k]:BASE[k]));
    document.querySelectorAll("#dots .dot").forEach(function(d){d.setAttribute("aria-pressed",String(d.getAttribute("data-p")===state.pal));});}
  function applyDensity(){document.body.setAttribute("data-density",state.den);document.querySelectorAll("#density button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-d")===state.den);});}
  function applyHidden(){var set={};state.hidden.forEach(function(k){set[k]=1;});
    document.querySelectorAll("[data-sec]").forEach(function(el){el.classList.toggle("cc-hide",!!set[el.getAttribute("data-sec")]);});
    document.querySelectorAll("#blocksPop input").forEach(function(i){i.checked=!set[i.value];});}

  var dots=document.getElementById("dots");

  document.querySelectorAll("#density button").forEach(function(b){b.onclick=function(){state.den=b.getAttribute("data-d");wl(LS.den,state.den);applyDensity();};});
  var SECTIONS=[["attributes","Атрибуты"],["statuses","Состояния"],["features","Черты"],["talents","Маг. таланты"],["skills","Навыки"],["items","Снаряжение"],["bio","Анкета"],["languages","Языки"],["relations","Связи"]];
  var pop=document.getElementById("blocksPop");
  pop.innerHTML=SECTIONS.map(function(s){return '<label><input type="checkbox" value="'+s[0]+'" checked> '+s[1]+'</label>';}).join("");
  pop.querySelectorAll("input").forEach(function(inp){inp.onchange=function(){var k=inp.value;state.hidden=state.hidden.filter(function(x){return x!==k;});if(!inp.checked)state.hidden.push(k);
    wl(LS.hidden,state.hidden.join(","));applyHidden();};});
  document.getElementById("blocksBtn").onclick=function(){pop.classList.toggle("on");};

  render();applyPalette();applyDensity();applyHidden();
  window.addEventListener("message",function(e){var d=e.data||{};if(d.type==="__activate_edit_mode")pop.classList.add("on");if(d.type==="__deactivate_edit_mode")pop.classList.remove("on");});
